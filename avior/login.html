<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — AVIOR Corporation</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="login-page">
    <div class="login-bg"></div>

    <div class="login-card animate-fadeInUp">
      <div class="login-logo">
        <div class="login-logo-icon">✈</div>
        <h1>AVIOR</h1>
        <p>Centro de Instrucción Aeronáutica Civil</p>
      </div>

      <!-- Tabs de demo -->
      <div class="login-tabs">
        <button class="login-tab active" onclick="setDemo('admin',this)">Admin</button>
        <button class="login-tab" onclick="setDemo('instructor',this)">Instructor</button>
        <button class="login-tab" onclick="setDemo('estudiante',this)">Estudiante</button>
      </div>

      <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
        <div id="loginError" class="login-error"></div>

        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" id="loginEmail" placeholder="usuario@avior.edu.bo" required>
        </div>

        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="loginPass" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn login-btn">Ingresar al Sistema</button>
      </form>

      <p class="login-back">
        ← <a href="index.html">Volver al sitio institucional</a>
      </p>

      <div style="margin-top:20px;background:rgba(139,0,0,0.08);border:1px solid rgba(139,0,0,0.2);border-radius:8px;padding:12px;font-size:.75rem;color:var(--texto-muted)">
        <strong style="color:var(--guindo-light)">Demo rápido:</strong><br>
        Admin: admin@avior.edu.bo / admin123<br>
        Instructor: cmamani@avior.edu.bo / inst123<br>
        Estudiante: acondori@avior.edu.bo / est123
      </div>

      <div style="margin-top:10px;background:rgba(255,152,0,0.08);border:1px solid rgba(255,152,0,0.3);border-radius:8px;padding:10px;font-size:.72rem;color:#ff9800;text-align:center">
        ⚠ Si el dashboard no carga correctamente,
        <button onclick="resetearDatos()" style="background:none;border:none;color:#ff9800;text-decoration:underline;cursor:pointer;font-size:.72rem;padding:0">haz clic aquí para limpiar caché</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Si ya hay sesión, redirigir
    if (getSession()) window.location.href = 'dashboard.html';

    // Forzar migración de datos al cargar login
    initData();

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const pass  = document.getElementById('loginPass').value;
      const result = login(email, pass);
      if (result.ok) {
        window.location.href = 'dashboard.html';
      } else {
        const errEl = document.getElementById('loginError');
        errEl.textContent = result.error;
        errEl.style.display = 'block';
      }
    }

    function setDemo(rol, btn) {
      document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      const demos = {
        admin:      ['admin@avior.edu.bo',    'admin123'],
        instructor: ['cmamani@avior.edu.bo',  'inst123'],
        estudiante: ['acondori@avior.edu.bo', 'est123'],
      };
      document.getElementById('loginEmail').value = demos[rol][0];
      document.getElementById('loginPass').value  = demos[rol][1];
      document.getElementById('loginError').style.display = 'none';
    }

    function resetearDatos() {
      localStorage.removeItem('avior_data');
      localStorage.removeItem('avior_data_version');
      sessionStorage.removeItem('avior_session');
      initData();
      alert('✅ Datos reseteados correctamente. Puedes iniciar sesión ahora.');
      location.reload();
    }
  </script>
</body>
</html>
